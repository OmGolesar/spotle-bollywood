<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero mockup v2 — Spotle Bollywood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;700&family=Yatra+One&family=Baloo+Bhai+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2250;
    --ink-deep:#1C1639;
    --paper:#F5EDD9;
    --red:#D63024;
    --mustard:#F2B01E;
    --pink:#E8328A;
    --royal:#2E52A6;
    --teal:#0E7E7E;
    --charcoal:#1A1612;
    --paper-mute:#C9BFA5;
    --paper-dim:#857C65;

    /* vertical rhythm scale */
    --util-h:72px;
    --footer-h:56px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Anek Devanagari',system-ui,sans-serif;
    background:var(--ink-deep);
    color:var(--paper);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* grain + glow */
  body::before{
    content:'';
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.88  0 0 0 0 0.70  0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;
    opacity:.5;
  }
  body::after{
    content:'';
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 32%, rgba(232,50,138,0.14), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 90%, rgba(28,22,57,0.95), var(--ink-deep) 70%);
  }

  /* ===== util strip (top chrome) ===== */
  .util{
    position:fixed;top:0;left:0;right:0;height:var(--util-h);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(20px,3vw,40px);
    z-index:5;
  }
  .brand-mini{
    font-family:'Yatra One',serif;
    font-size:clamp(16px,1.4vw,20px);
    letter-spacing:.04em;
    color:var(--mustard);
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .streak{
    display:flex;align-items:center;gap:10px;
    font-family:'Anek Devanagari';font-weight:500;
    font-size:clamp(11px,1vw,13px);letter-spacing:.18em;text-transform:uppercase;
    color:var(--paper-mute);
  }
  .streak-chip{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--red);color:var(--paper);
    padding:5px 12px;border-radius:999px;
    font-family:'Baloo Bhai 2',system-ui;font-weight:700;
    font-size:12px;letter-spacing:.08em;
    box-shadow:0 2px 8px rgba(214,48,36,.4);
  }
  .streak-chip .star{color:var(--mustard);font-size:10px}

  /* ===== main hero (centered, fits in viewport) ===== */
  .hero{
    position:relative;z-index:2;
    min-height:100vh;
    padding:calc(var(--util-h) + 16px) clamp(20px,4vw,48px) calc(var(--footer-h) + 16px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(20px,2.5vh,32px);
    text-align:center;
  }

  /* ===== poster ===== */
  .logo-wrap{
    position:relative;
    /* height-first sizing so poster never dominates */
    height:min(52vh,460px);
    aspect-ratio:1134 / 1340;
    max-width:min(85vw,420px);
    filter:drop-shadow(0 24px 48px rgba(0,0,0,.55));
  }
  .logo-wrap .slide{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 900ms ease-in-out;
    will-change:opacity;
  }
  .logo-wrap .slide.is-active{opacity:1}

  .dots{
    display:flex;gap:7px;justify-content:center;
    margin-top:-4px;
  }
  .dots .dot{
    width:6px;height:6px;border-radius:999px;background:rgba(245,237,217,.25);
    transition:background 300ms, transform 300ms;
  }
  .dots .dot.is-active{background:var(--mustard);transform:scale(1.4)}

  /* ===== meta block (date + tagline + CTA + diff) ===== */
  .meta{
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(14px,1.8vh,20px);
    max-width:640px;
  }

  .date{
    font-family:'Baloo Bhai 2',system-ui;font-weight:500;
    font-size:clamp(11px,1vw,13px);letter-spacing:.22em;text-transform:uppercase;
    color:#E8DBB0;
    display:inline-flex;align-items:center;gap:12px;
    padding:7px 18px 6px;
    border:1px solid rgba(242,176,30,.4);
    border-radius:999px;
  }
  .date::before,.date::after{content:'★';color:var(--mustard);font-size:10px}

  .tagline{
    font-family:'Yatra One',serif;
    font-size:clamp(22px,2.6vw,30px);
    line-height:1.25;
    color:var(--paper);
  }
  .tagline-en{
    display:block;
    font-family:'Anek Devanagari';font-weight:500;
    font-size:clamp(10px,.95vw,12px);letter-spacing:.22em;text-transform:uppercase;
    color:var(--paper-mute);
    margin-top:8px;
  }

  .play{
    display:inline-flex;align-items:center;gap:14px;
    font-family:'Yatra One',serif;
    font-size:clamp(22px,2vw,26px);letter-spacing:.04em;
    color:var(--charcoal);
    background:var(--mustard);
    padding:14px 36px 14px 28px;
    border-radius:999px;
    text-decoration:none;cursor:pointer;border:none;
    box-shadow:0 0 0 4px rgba(242,176,30,.18), 0 20px 48px rgba(242,176,30,.3);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .play:hover{transform:translateY(-2px);box-shadow:0 0 0 6px rgba(242,176,30,.22), 0 26px 60px rgba(242,176,30,.42)}
  .play .arrow{
    display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;
    background:var(--red);color:var(--paper);border-radius:999px;font-size:12px;padding-left:2px;
  }
  .play small{
    font-family:'Anek Devanagari';font-weight:600;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(26,22,18,.6);
    margin-left:4px;
  }

  .diff{
    display:flex;gap:8px;align-items:center;justify-content:center;
    font-family:'Anek Devanagari';font-weight:500;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-mute);
  }
  .diff a{
    color:var(--paper);text-decoration:none;
    padding:5px 12px;
    border:1px solid rgba(245,237,217,.22);
    border-radius:999px;
    transition:all .15s;
  }
  .diff a:hover{background:rgba(245,237,217,.08);border-color:rgba(242,176,30,.6)}
  .diff .active{background:var(--red);border-color:var(--red)}

  /* ===== footer ===== */
  .bottom{
    position:fixed;left:0;right:0;bottom:0;height:var(--footer-h);
    display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;
    padding:0 clamp(20px,3vw,40px);
    font-family:'Anek Devanagari';font-weight:500;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-dim);
    z-index:3;
  }
  .bottom a{color:var(--paper-mute);text-decoration:none}
  .bottom a:hover{color:var(--mustard)}
  .bottom .sep{color:#4A4267}

  /* ===== star rails ===== */
  .star-rail{
    position:fixed;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:16px;
    color:var(--mustard);font-size:11px;
    opacity:.55;z-index:2;
    pointer-events:none;
  }
  .star-rail.left{left:clamp(20px,3vw,44px)}
  .star-rail.right{right:clamp(20px,3vw,44px)}

  /* ===== responsive ===== */
  @media (max-width:720px){
    :root{--util-h:60px;--footer-h:48px}
    .star-rail{display:none}
    .play{font-size:22px;padding:14px 30px}
    .logo-wrap{height:min(44vh,380px)}
  }
  @media (max-height:720px) and (min-width:721px){
    .logo-wrap{height:min(44vh,360px)}
  }
  @media (prefers-reduced-motion: reduce){
    .logo-wrap .slide{transition:none}
    .play,.diff a{transition:none}
  }
</style>
</head>
<body>
  <header class="util">
    <span class="brand-mini">बॉलीवुड स्पॉटल</span>
    <div class="streak">
      <span>Streak</span>
      <span class="streak-chip"><span class="star">★</span>4</span>
    </div>
  </header>

  <aside class="star-rail left" aria-hidden>
    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
  </aside>
  <aside class="star-rail right" aria-hidden>
    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
  </aside>

  <main class="hero">
    <div class="logo-wrap" id="logoWrap" aria-live="polite" aria-label="Spotle Bollywood posters"></div>

    <div class="dots" id="dots" aria-hidden="true"></div>

    <div class="meta">
      <div class="date">Saturday · 10 October 2026</div>

      <h1 class="tagline">
        आज की फ़िल्म पहचानिए — दस कोशिशों में
        <span class="tagline-en">Guess today's film in 10 tries</span>
      </h1>

      <button class="play">
        <span class="arrow">▶</span>
        PLAY <small>खेलें</small>
      </button>

      <div class="diff">
        <a href="#" class="active">Easy</a>
        <a href="#">Medium</a>
        <a href="#">Hard</a>
      </div>
    </div>
  </main>

  <footer class="bottom">
    <a href="#">How to play</a><span class="sep">·</span>
    <a href="#">Archive</a><span class="sep">·</span>
    <a href="#">Credits</a><span class="sep">·</span>
    <span>v1.1 — Bollywood Edition</span>
  </footer>

<script>
  const posters = [
    'title-logo.png',
    'poster-01-retro.png',
    'poster-02-halftone.png',
    'poster-03-rose.png',
    'poster-04-matchbox.png',
    'poster-05-devanagari.png'
  ];
  const wrap = document.getElementById('logoWrap');
  const dotsRow = document.getElementById('dots');

  posters.forEach((name, i) => {
    const img = document.createElement('img');
    img.className = 'slide' + (i === 0 ? ' is-active' : '');
    img.src = '/files/' + encodeURIComponent(name);
    img.alt = 'Spotle Bollywood poster ' + (i + 1);
    img.decoding = 'async';
    img.loading = i === 0 ? 'eager' : 'lazy';
    wrap.appendChild(img);

    const dot = document.createElement('span');
    dot.className = 'dot' + (i === 0 ? ' is-active' : '');
    dotsRow.appendChild(dot);
  });

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReduced && posters.length > 1) {
    let idx = 0;
    const slides = wrap.querySelectorAll('.slide');
    const dots = dotsRow.querySelectorAll('.dot');
    setInterval(() => {
      slides[idx].classList.remove('is-active');
      dots[idx].classList.remove('is-active');
      idx = (idx + 1) % slides.length;
      slides[idx].classList.add('is-active');
      dots[idx].classList.add('is-active');
    }, 5000);
  }
</script>
</body>
</html>
